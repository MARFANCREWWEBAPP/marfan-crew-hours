
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Marfan Crew Hours</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>MARFAN CREW HOURS</h1>

    <div class="tabs">
      <button onclick="showAdmin()">ADMIN</button>
      <button onclick="showEmployee()">OPERARIO</button>
    </div>

    <div id="adminBox">
      <input id="adminEmail" placeholder="Email admin">
      <input id="adminPass" type="password" placeholder="Contraseña">
      <button onclick="loginAdmin()">Entrar Admin</button>
    </div>

    <div id="employeeBox" style="display:none;">
      <input id="employeePhone" placeholder="Teléfono operario">
      <button onclick="loginEmployee()">Entrar Operario</button>
    </div>

    <div id="result"></div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
