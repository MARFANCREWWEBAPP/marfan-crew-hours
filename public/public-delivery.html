<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Firma de albarán · Marfan Crew</title><link rel="stylesheet" href="/styles.css"><style>body{padding:24px}.wrap{max-width:860px;margin:auto}.sig{border:1px solid #ddd;border-radius:16px;background:#fff;width:100%;height:180px;touch-action:none}</style></head><body><main class="wrap"><section class="card"><h1>Firma de albarán</h1><p class="muted">Revisa el servicio y firma en la parte inferior.</p><div id="content">Cargando...</div></section></main><script>
const token=new URLSearchParams(location.search).get('token');
const content=document.getElementById('content');
function esc(v){return String(v??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function table(head,rows){return `<div class="tablewrap"><table class="table"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
async function api(path, opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}}); const d=await r.json().catch(()=>({})); if(!r.ok) throw new Error(d.error||'Error'); return d;}
async function boot(){try{const {note,lines}=await api('/api/public/delivery/'+token); content.innerHTML=`<h2>${esc(note.number)}</h2><p><b>Cliente:</b> ${esc(note.client_name)} · <b>Fecha:</b> ${esc(note.event_date)}</p>${table(['Operario','Entrada','Salida','H. normales','H. nocturnas'],lines.map(l=>[esc(l.worker_name),esc(l.check_in),esc(l.check_out),Number(l.normal_hours||0).toFixed(2),Number(l.night_hours||0).toFixed(2)]))}<p><b>Total IVA incluido:</b> ${Number(note.grand_total_vat||0).toLocaleString('es-ES',{style:'currency',currency:'EUR'})}</p>${note.locked?'<p class="pill">Este albarán ya está firmado.</p>':`<form id="f" class="formgrid"><input name="signature_name" placeholder="Nombre y apellidos" required><input name="signature_dni" placeholder="DNI/NIF"><textarea name="client_observations" placeholder="Observaciones del cliente"></textarea><canvas id="sig" class="sig" width="760" height="180"></canvas><button type="button" class="secondary" id="clear">Limpiar firma</button><button class="blue">Firmar albarán</button></form>`}`; setup();}catch(e){content.innerHTML='<p>No se puede abrir este albarán.</p>'}}
function setup(){const f=document.getElementById('f'); if(!f)return; const c=document.getElementById('sig'),ctx=c.getContext('2d'); ctx.lineWidth=2; let d=false; const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e; return{x:(p.clientX-r.left)*(c.width/r.width),y:(p.clientY-r.top)*(c.height/r.height)}}; const down=e=>{d=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()}; const move=e=>{if(!d)return;let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()}; const up=()=>d=false; ['mousedown','touchstart'].forEach(x=>c.addEventListener(x,down)); ['mousemove','touchmove'].forEach(x=>c.addEventListener(x,move)); ['mouseup','mouseleave','touchend'].forEach(x=>c.addEventListener(x,up)); document.getElementById('clear').onclick=()=>ctx.clearRect(0,0,c.width,c.height); f.onsubmit=async e=>{e.preventDefault(); const b=Object.fromEntries(new FormData(f)); b.signature_data_url=c.toDataURL('image/png'); await api('/api/public/delivery/'+token+'/sign',{method:'POST',body:JSON.stringify(b)}); content.innerHTML='<h2>Albarán firmado correctamente</h2><p>Gracias.</p>';};}
boot();
</script></body></html>
